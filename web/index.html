<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <title>Army - Hệ thống kết nối 🐜</title>
  
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #0B0B0E;
      --card-bg: rgba(20, 20, 25, 0.65);
      --card-border: rgba(255, 77, 77, 0.15);
      --text-main: #FFFFFF;
      --text-muted: #8E8E93;
      --primary-red: #FF4D4D;
      --red-gradient: linear-gradient(135deg, #FF6B6B, #FF4D4D);
      --red-glow: rgba(255, 77, 77, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }

    /* Animated background blobs */
    .bg-shapes {
      position: absolute;
      inset: 0;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      animation: float 20s infinite ease-in-out alternate;
    }

    .blob-1 {
      top: -10%;
      left: -10%;
      width: 50vw;
      height: 50vw;
      background: rgba(255, 77, 77, 0.08);
    }

    .blob-2 {
      right: -10%;
      bottom: -10%;
      width: 60vw;
      height: 60vw;
      background: rgba(255, 199, 44, 0.05);
      animation-delay: -5s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(5%, 8%) scale(1.08); }
      100% { transform: translate(-5%, -5%) scale(0.92); }
    }

    main {
      position: relative;
      z-index: 2;
      width: min(100%, 420px);
      padding: 48px 32px;
      border: 1px solid var(--card-border);
      border-radius: 32px;
      background: var(--card-bg);
      text-align: center;
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .logo-wrapper {
      position: relative;
      width: 90px;
      height: 90px;
      margin: 0 auto 32px;
    }

    .logo {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 28px;
      background: var(--red-gradient);
      box-shadow: 
        0 10px 24px var(--red-glow),
        inset 0 2px 4px rgba(255, 255, 255, 0.2);
      font-size: 40px;
    }

    h1 {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      background: linear-gradient(180deg, #FFFFFF 0%, #E5E5EA 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 32px;
    }

    .info-box {
      background: rgba(255, 77, 77, 0.06);
      border: 1px solid rgba(255, 77, 77, 0.15);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 12px;
      font-size: 13px;
      line-height: 1.5;
      color: #FFB3B3;
      text-align: left;
    }

    .footer-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 36px;
      opacity: 0.5;
    }

    .footer-icon {
      font-size: 16px;
    }

    .footer-text {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 1.5px;
      color: var(--text-main);
    }
  </style>
</head>
<body>
  <div class="bg-shapes" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <main>
    <div class="logo-wrapper">
      <div class="logo">🚫</div>
    </div>

    <h1>Tru cập không hợp lệ</h1>
    <p class="subtitle">Đường dẫn trang chủ hiện không hỗ trợ truy cập trực tiếp trên trình duyệt.</p>

    <div class="info-box">
      <strong>Lưu ý:</strong> Ứng dụng Army chỉ hỗ trợ xem thông tin lời mời kết bạn từ bạn bè thông qua liên kết mời trực tiếp có dạng:<br>
      <code style="display: block; margin-top: 8px; font-family: monospace; color: #FFF; font-size: 12px; word-break: break-all;">https://army-txa-app.web.app/invite/username</code>
    </div>

    <div class="footer-logo">
      <span class="footer-icon">🐜</span>
      <span class="footer-text">ARMY SYSTEM</span>
    </div>
  </main>
</body>
</html>
