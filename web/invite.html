  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      color-scheme: dark;
      --primary-yellow: #FFC72C;
      --primary-gradient: linear-gradient(135deg, #FFE082, #FFC72C);
      --primary-glow: rgba(255, 199, 44, 0.3);
      --bg-color: #0B0B0E;
      --card-bg: rgba(20, 20, 25, 0.65);
      --card-border: rgba(255, 199, 44, 0.15);
      --text-main: #FFFFFF;
      --text-muted: #8E8E93;
      --badge-bg: rgba(255, 199, 44, 0.08);
      --badge-border: rgba(255, 199, 44, 0.25);
      --badge-text: #FFC72C;
      --blob-1: rgba(255, 199, 44, 0.12);
      --blob-2: rgba(255, 224, 130, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Background animated floating blobs */
    .bg-shapes {
      position: absolute;
      inset: 0;
      z-index: -1;
      overflow: hidden;
    }

    .blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      animation: float 20s infinite ease-in-out alternate;
      will-change: transform;
    }

    .blob-1 {
      top: -10%;
      left: -10%;
      width: 65vw;
      height: 65vw;
      background: var(--blob-1);
    }

    .blob-2 {
      right: -10%;
      bottom: -20%;
      width: 75vw;
      height: 75vw;
      background: var(--blob-2);
      animation-delay: -5s;
    }

    @keyframes float {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(5%, 10%) scale(1.08); }
      100% { transform: translate(-5%, -5%) scale(0.92); }
    }

    /* Glassmorphic Container */
    main {
      position: relative;
      width: min(100%, 420px);
      padding: 40px 32px;
      border: 1px solid var(--card-border);
      border-radius: 36px;
      background: var(--card-bg);
      text-align: center;
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.6), 
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      animation: cardReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(30px);
    }

    @keyframes cardReveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Mascot Profile/Glow Wrapper */
    .logo-wrapper {
      position: relative;
      width: 92px;
      height: 92px;
      margin: 0 auto 28px;
    }

    .logo-wrapper::after {
      content: "";
      position: absolute;
      inset: -8px;
      z-index: -1;
      border-radius: 50%;
      background: var(--primary-gradient);
      filter: blur(20px);
      opacity: 0.25;
    }

    .logo {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: rgba(255, 199, 44, 0.15);
      border: 2px solid var(--primary-yellow);
      color: #FFFFFF;
      font-size: 42px;
      overflow: hidden;
      box-shadow: 
        0 12px 24px var(--primary-glow),
        inset 0 2px 4px rgba(255, 255, 255, 0.2);
      transition: background-color 0.3s ease;
    }

    .logo.is-photo {
      background: #FFFFFF;
    }

    .logo img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    h1 {
      margin-bottom: 10px;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #FFFFFF 0%, #E5E5EA 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      margin-bottom: 24px;
      color: var(--text-muted);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.6;
    }

    /* ID Badge */
    .id-badge-container {
      margin-bottom: 32px;
    }

    .id-badge {
      display: inline-flex;
      align-items: center;
      max-width: 100%;
      padding: 10px 20px;
      border: 1px solid var(--badge-border);
      border-radius: 14px;
      background: var(--badge-bg);
      color: var(--badge-text);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.5px;
      overflow-wrap: anywhere;
    }

    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Premium Button Styles */
    .btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 24px;
      border-radius: 20px;
      font-size: 16px;
      font-weight: 900;
      text-decoration: none;
      border: none;
      transition: 
        transform 0.25s cubic-bezier(0.4, 0, 0.2, 1),
        box-shadow 0.25s ease,
        filter 0.25s ease;
      cursor: pointer;
    }

    .btn:active {
      transform: scale(0.96);
    }

    .btn-primary {
      background: var(--primary-gradient);
      color: #000000;
      box-shadow: 0 8px 20px var(--primary-glow);
    }

    .btn-primary:hover {
      filter: brightness(1.06);
      box-shadow: 0 12px 28px rgba(255, 199, 44, 0.45);
    }

    .btn-primary svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 2.5;
    }

    .btn-secondary {
      background-color: rgba(255, 255, 255, 0.05);
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .btn-secondary:hover {
      background-color: rgba(255, 255, 255, 0.09);
    }

    @keyframes click-bounce {
      0% { transform: scale(1); }
      30% { transform: scale(0.92); }
      70% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
    .click-bounce {
      animation: click-bounce 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
    }

    /* Store Badges - Hidden/Placeholder as requested */
    .store-badges-container {
      display: none; /* Tạm ẩn theo yêu cầu */
      margin-top: 10px;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      justify-content: center;
    }

    .store-badges {
      display: flex;
      justify-content: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .store-badge {
      display: block;
      transition: 
        transform 0.25s cubic-bezier(0.4, 0, 0.2, 1),
        filter 0.25s ease;
      cursor: pointer;
    }

    .store-badge:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    .store-badge:active {
      transform: scale(0.96);
    }

    .store-badge svg {
      display: block;
      height: 42px;
      width: auto;
      border-radius: 6px;
    }

    .footer-note {
      display: block;
      margin-top: 28px;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.6;
      opacity: 0.8;
    }

    /* App Logo Footer */
    .footer-logo {
      margin-top: 36px;
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0.65;
      animation: fadeIn 1.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 0.65; }
    }

    .footer-icon {
      font-size: 18px;
    }

    .footer-text {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #FFFFFF;
    }

    /* Toast Alert Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      background-color: rgba(20, 20, 25, 0.95);
      border: 1px solid rgba(255, 199, 44, 0.25);
      color: #FFFFFF;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 100;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 380px) {
      main {
        padding: 36px 20px;
        border-radius: 30px;
      }
      .store-badges {
        gap: 10px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .blob, main {
        animation: none;
      }
      main {
        opacity: 1;
        transform: none;
      }
      .btn, .store-badge {
        transition: none;
      }
    }

    /* Checkmark Animation Styles */
    .checkmark-svg {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: inline-block;
      stroke-width: 5;
      stroke: #4ADE80;
      stroke-miterlimit: 10;
      vertical-align: middle;
    }
    .checkmark-circle {
      stroke-dasharray: 166;
      stroke-dashoffset: 166;
      stroke-width: 5;
      stroke-miterlimit: 10;
      stroke: #4ADE80;
      fill: none;
      animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) forwards;
    }
    .checkmark-check {
      transform-origin: 50% 50%;
      stroke-dasharray: 48;
      stroke-dashoffset: 48;
      stroke: #4ADE80;
      stroke-width: 5;
      animation: stroke 0.3s cubic-bezier(0.65, 0, 0.45, 1) 0.15s forwards;
    }
    @keyframes stroke {
      100% {
        stroke-dashoffset: 0;
      }
    }
  </style>
</head>

    <!-- Static Footer Info Note -->
    <small class="footer-note" id="fallback-desc">
      Nếu ứng dụng không tự động mở, vui lòng cài đặt ứng dụng Army trên thiết bị của bạn và nhập ID này để kết nối.
    </small>
  </main>

  <!-- Footer Branding -->
  <div class="footer-logo">
    <span class="footer-icon">🐜</span>
    <span class="footer-text">ARMY</span>
  </div>

  <!-- Toast Notification Msg -->
  <div class="toast" id="toast-msg">
    <span>🔗</span> <span id="toast-text">Đã sao chép liên kết chia sẻ!</span>
  </div>

  <script>
    // 1. Extract username from URL path
    const path = window.location.pathname;
    const segments = path.split('/').filter(Boolean);
    const inviteIdx = segments.indexOf('invite');
    let usernameVal = '';
    if (inviteIdx !== -1 && inviteIdx + 1 < segments.length) {
      usernameVal = segments[inviteIdx + 1];
    }

    // Function to render premium invalid user/link UI
    function showInvalidUser(username) {
      document.getElementById('invite-title').innerText = 'Liên kết không hợp lệ ⚠️';
      document.getElementById('invite-desc').innerText = username 
        ? `Không tìm thấy người dùng ${username} trên hệ thống. Vui lòng kiểm tra lại liên kết mời kết bạn.`
        : 'Không tìm thấy thông tin lời mời kết bạn. Vui lòng kiểm tra lại đường dẫn.';
      
      document.getElementById('username-display').innerText = username || '@unknown';
      
      const avatarEl = document.getElementById('user-avatar');
      avatarEl.innerText = '⚠️';
      avatarEl.style.backgroundColor = '#FF4D4D';
      
      // Hide the action buttons container and fallback descriptions completely
      const actionButtons = document.querySelector('.action-buttons');
      if (actionButtons) {
        actionButtons.style.display = 'none';
      }
      const fallbackDesc = document.getElementById('fallback-desc');
      if (fallbackDesc) {
        fallbackDesc.style.display = 'none';
      }
    }

    if (!usernameVal) {
      showInvalidUser('');
    } else {
      // Format Display
      let displayUsername = usernameVal;
      if (!displayUsername.startsWith('@')) {
        displayUsername = '@' + displayUsername;
      }
      document.getElementById('username-display').innerText = displayUsername;

      // 2. Fetch User Profile Info from Firebase Firestore via REST API
      fetchUserProfile(displayUsername);
    }

    async function fetchUserProfile(displayUsername) {
      try {
        const response = await fetch('https://firestore.googleapis.com/v1/projects/army-txa-app/databases/(default)/documents:runQuery', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            structuredQuery: {
              from: [{ collectionId: 'users' }],
              where: {
                fieldFilter: {
                  field: { fieldPath: 'username' },
                  op: 'EQUAL',
                  value: { stringValue: displayUsername }
                }
              },
              limit: 1
            }
          })
        });

        if (response.ok) {
          const results = await response.json();
          const userDoc = results[0]?.document;
          if (userDoc) {
            const fields = userDoc.fields;
            const avatar = fields.avatar?.stringValue || '🦊';
            const colorHex = fields.avatarBgColor?.stringValue || '0xFFFFC72C';
            
            // Render custom UI
            const avatarEl = document.getElementById('user-avatar');
            avatarEl.innerText = avatar;
            
            // Format 0xFF... to CSS hex color code
            let cssColor = colorHex;
            if (cssColor.startsWith('0x')) {
              cssColor = '#' + cssColor.substring(4); // Remove alpha 0xFF
            }
            avatarEl.style.backgroundColor = cssColor;
            
            // Update UI description
            document.getElementById('invite-title').innerText = `Kết bạn cùng ${displayUsername} 🐜`;
            document.getElementById('invite-desc').innerText = `${displayUsername} muốn mời bạn làm bạn trên ứng dụng Army. Hãy mở app để kết nối và chia sẻ locket hàng ngày!`;
          } else {
            // User does not exist in Firestore
            showInvalidUser(displayUsername);
          }
        } else {
          showInvalidUser(displayUsername);
        }
      } catch (err) {
        console.error('Error fetching Firestore user details:', err);
        // Fallback to warning UI if query fails
        showInvalidUser(displayUsername);
      }
    }

    // 3. Action Logic: Redirect to txa:// protocol
    function openInApp() {
      if (!usernameVal) return;
      // Stripped username without @ for URL scheme
      const cleanUser = usernameVal.replace('@', '');
      const deepLink = 'txa://invite/' + cleanUser;
      
      // Attempt redirection
      window.top.location.href = deepLink;

      // Fallback notification after 2.5s if nothing happens
      setTimeout(() => {
        showToast('Nếu app không tự mở, vui lòng kiểm tra xem bạn đã cài đặt ứng dụng chưa.', '📲');
      }, 2500);
    }

    // 4. Action Logic: Copy Invite link
    function copyInviteLink() {
      const link = window.location.href;
      const btn = document.querySelector('.btn-secondary');
      const defaultContent = btn.querySelector('.btn-content-default');
      const successContent = btn.querySelector('.btn-content-success');
      
      // Add bounce animation
      btn.classList.add('click-bounce');
      btn.addEventListener('animationend', () => {
        btn.classList.remove('click-bounce');
      }, { once: true });

      navigator.clipboard.writeText(link).then(() => {
        // Toggle contents
        defaultContent.style.display = 'none';
        successContent.style.display = 'inline-flex';
        successContent.style.alignItems = 'center';
        successContent.style.justifyContent = 'center';
        successContent.style.gap = '8px';
        
        // Success state border glow
        btn.style.borderColor = 'rgba(74, 222, 128, 0.4)';
        btn.style.boxShadow = '0 0 15px rgba(74, 222, 128, 0.15)';

        showToast('Đã sao chép liên kết chia sẻ!', '🔗');

        setTimeout(() => {
          successContent.style.display = 'none';
          defaultContent.style.display = 'block';
          btn.style.borderColor = 'rgba(255, 255, 255, 0.08)';
          btn.style.boxShadow = 'none';
        }, 2000);
      }).catch(err => {
        showToast('Không thể sao chép liên kết.', '❌');
      });
    }

    // Toast utility helper
    let toastTimeout;
    function showToast(text, emoji) {
      const toast = document.getElementById('toast-msg');
      const toastText = document.getElementById('toast-text');
      
      toastText.innerText = text;
      toast.querySelector('span').innerText = emoji || 'ℹ️';
      
      toast.classList.add('show');
      
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
      }, 3500);
    }
  </script>
